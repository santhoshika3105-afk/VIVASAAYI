<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - VIVASAAYI</title>
    <style>
        body { font-family: Arial; margin: 0; }
        .sidebar {
            width: 200px;
            height: 100vh;
            background: #2c3e50;
            color: white;
            position: fixed;
            padding: 20px;
        }
        .content {
            margin-left: 220px;
            padding: 20px;
        }
        .card {
            background: #f4f4f4;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>VIVASAAYI</h2>
    <p><a href="index.html" style="color:white;">Home</a></p>
    <p>Bookings</p>
    <p>Users</p>
</div>

<div class="content">
    <h1>Dashboard</h1>

    <div class="card">Total Bookings: 25</div>
    <div class="card">Active Users: 10</div>
    <div class="card">Revenue: ₹5000</div>
</div>

</body>
</html>
<script>
let bookings = 25;
document.querySelector(".card").innerText = "Total Bookings: " + bookings;
</script><form id="bookingForm">
  <input type="text" placeholder="Name" required>
  <button type="submit">Book</button>
</form>
<script>
document.getElementById("bookingForm").addEventListener("submit", function(e){
  e.preventDefault();
  localStorage.setItem("booking", "New Booking Done");
  alert("Booking Saved!");
});
</script>
<script>
let data = localStorage.getItem("booking");
if(data){
  document.body.innerHTML += "<p>" + data + "</p>";
}
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<canvas id="myChart"></canvas>
<script>
new Chart(document.getElementById("myChart"), {
  type: 'bar',
  data: {
    labels: ['Jan', 'Feb'],
    datasets: [{
      label: 'Bookings',
      data: [5, 10]
    }]
  }
});
</script>
<h2 id="totalBookings">Total Bookings: 0</h2>
<script>
let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

// Update total count
document.getElementById("totalBookings").innerText =
  "Total Bookings: " + bookings.length;
</script>
